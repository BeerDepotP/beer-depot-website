<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box}
body{margin:0;width:8.5in;height:11in;font-family:"Barlow",Arial,sans-serif;color:#22160F;background:#fff}
.half{width:8.5in;height:5.5in;padding:.22in;position:relative}
.half + .half::before{content:"";position:absolute;top:0;left:.15in;right:.15in;border-top:1px dashed #9A8E86}
.card{height:100%;border:.12in solid #2B1A10;padding:.25in .3in;display:flex;align-items:center;gap:.3in}
.text{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;height:100%}
.logo{width:1.35in;margin:0 0 .1in}
.kick{font:700 12pt "Barlow",Arial;letter-spacing:.06em;text-transform:uppercase;color:#2B1A10;margin:0}
h1{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:44pt;line-height:.9;color:#F26B1D;margin:.04in 0 .1in}
.lede{font:600 13.5pt "Barlow",Arial;margin:0;line-height:1.25}
.fine{margin-top:auto;font:500 9.5pt "Barlow",Arial;color:#6B5A4E;line-height:1.3}
.side{display:flex;flex-direction:column;align-items:center;text-align:center}
.qr{width:2.75in;height:2.75in;border:.045in solid #F26B1D;border-radius:.14in;padding:.035in;background:#fff}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.scan{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:26pt;color:#2B1A10;margin:.08in 0 0;line-height:1}
.url{font:700 10.5pt "Barlow",Arial;margin:.04in 0 0}
</style></head><body>
<div class="half"><div class="card">
 <div class="text">
  <img class="logo" src="logo-orange.png">
  <p class="kick">Allocated Bourbon</p>
  <h1>Join the<br>Bourbon Club</h1>
  <p class="lede">Every Thursday at 5 PM, get an email with every allocated bottle we have in stock.</p>
  <p class="fine">Must be 21 or older · Free · First come, first served, in store only · Unsubscribe anytime</p>
 </div>
 <div class="side">
  <div class="qr"><img src="bourbon-club-qr.png"></div>
  <p class="scan">Scan to Join</p>
  <p class="url">or visit beerdepotpewaukee.com/club</p>
 </div>
</div></div>
<div class="half" id="h2"></div>
<script>document.getElementById("h2").innerHTML=document.querySelector(".half").innerHTML</script>
</body></html>
