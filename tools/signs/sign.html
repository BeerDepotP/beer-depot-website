<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box}
body{margin:0;width:8.5in;height:11in;font-family:"Barlow",Arial,sans-serif;color:#22160F;background:#fff}
.page{height:11in;padding:.55in .6in;display:flex;flex-direction:column;align-items:center;text-align:center;border:.18in solid #2B1A10}
.logo{width:2.1in;margin:0 0 .18in}
.kick{font:700 22pt "Barlow",Arial;letter-spacing:.06em;text-transform:uppercase;color:#2B1A10;margin:0}
h1{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:68pt;line-height:.9;color:#F26B1D;margin:.06in 0 .14in}
.lede{font:600 21pt "Barlow",Arial;margin:0 0 .2in;max-width:6.4in;line-height:1.2}
.qr{width:3.5in;height:3.5in;border:.06in solid #F26B1D;border-radius:.2in;padding:.05in;background:#fff}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.scan{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:36pt;color:#2B1A10;margin:.2in 0 .02in}
.url{font:700 17pt "Barlow",Arial;margin:0}
.fine{margin-top:auto;font:500 13pt "Barlow",Arial;color:#6B5A4E}
</style></head><body><div class="page">
<img class="logo" src="logo-orange.png">
<p class="kick">Allocated Bourbon</p>
<h1>Join the Bourbon Club</h1>
<p class="lede">Every Thursday at 5 PM, get an email with every allocated bottle we have in stock.</p>
<div class="qr"><img src="bourbon-club-qr.png"></div>
<p class="scan">Scan to Join</p>
<p class="url">or visit beerdepotpewaukee.com/club</p>
<p class="fine">Must be 21 or older · Free · First come, first served, in store only · Unsubscribe anytime</p>
</div></body></html>
