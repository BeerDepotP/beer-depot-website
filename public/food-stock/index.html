<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Food Stock · The Beer Depot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#F26B1D;--glass:#2B1A10;--kraft:#F3ECE3;--ink:#22160F;--muted:#6F6259;--line:#E3D9CE;--in:#1F7A3A;
        --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--kraft);font-size:17px}
  header{background:var(--glass);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}
  header img{width:96px}
  header h1{font-family:var(--display);font-weight:900;font-size:30px;margin:0;line-height:1}
  header nav{margin-left:auto}
  header nav a{color:#fff;font-weight:700;text-decoration:none;border:2px solid var(--orange);border-radius:999px;padding:6px 12px;font-size:15px}
  main{max-width:620px;margin:0 auto;padding:16px 16px 60px}
  :focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .card{background:#fff;border-radius:14px;padding:18px}
  .pin h2{font-family:var(--display);font-size:34px;margin:0 0 6px}
  .pin p{margin:0 0 14px;color:var(--muted)}
  .pin input{font:600 26px var(--body);letter-spacing:6px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;text-align:center}
  .pin input:focus{border-color:var(--orange);outline:none}
  .btn{font:700 18px var(--body);padding:14px 18px;border-radius:12px;border:2px solid var(--orange);background:var(--orange);color:#fff;cursor:pointer;width:100%;margin-top:12px}
  .btn[disabled]{opacity:.6}
  .msg{min-height:1.4em;margin:10px 0 0;font-weight:600;color:#A3361A}
  h2.sec{font-family:var(--display);font-weight:900;font-size:32px;margin:24px 0 4px}
  h3.grp{margin:16px 0 6px;font-size:16px;color:var(--muted);font-weight:700}
  ul{list-style:none;margin:0;padding:0;background:#fff;border-radius:14px;overflow:hidden}
  li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .nm{font-weight:600}
  .st{display:block;font-size:14px;font-weight:700;color:var(--muted)}
  .st.on{color:var(--in)}
  .sw{flex:none;width:64px;height:36px;border-radius:999px;border:0;background:#CFC6BE;position:relative;cursor:pointer;transition:background .15s}
  .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .sw[aria-checked="true"]{background:var(--in)}
  .sw[aria-checked="true"]::after{left:32px}
  .sw[disabled]{opacity:.5}
  @media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--glass);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{background:#A3361A}
  .help{color:var(--muted);font-size:15px;margin:6px 0 0}
  .out{background:transparent;border:0;color:var(--muted);font:600 15px var(--body);text-decoration:underline;cursor:pointer;margin-top:20px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><img src="/img/logo-orange.png" alt="The Beer Depot"><h1>Food Stock</h1><nav><a href="/searches/">Searches</a></nav></header>
<main>
  <form class="card pin" id="pin-form">
    <h2>Enter Your PIN</h2>
    <p>Switch food and Local Favorites between In Stock and Out of Stock. Changes show on the website within a minute.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN">
    <button class="btn" id="pin-go" type="submit">Unlock</button>
    <p class="msg" id="pin-msg" role="alert"></p>
  </form>

  <div id="lists" hidden>
    <p class="help">Green means In Stock on the website. Each switch saves as soon as you tap it.</p>
    <h2 class="sec">Made Here</h2>
    <div id="food"></div>
    <h2 class="sec">Local Favorites</h2>
    <div id="local"></div>
    <button class="out" id="lock">Lock this page</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/menu.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
let pin = "", switches = {}, stock = [];
const ss = { get(k){ try{return sessionStorage.getItem(k)||""}catch(e){return ""} }, set(k,v){ try{ v?sessionStorage.setItem(k,v):sessionStorage.removeItem(k) }catch(e){} } };

function toast(text, err){ const t=$("#toast"); t.textContent=text; t.className="toast show"+(err?" err":""); clearTimeout(toast.t); toast.t=setTimeout(()=>t.className="toast",2200); }

async function post(body){
  const r = await fetch("/api/food-stock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin,...body})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || "Couldn't save. Check your connection and try again.");
  return j;
}

function koronaSays(item){
  const words = norm(item.match||item.name).split(" ");
  const hits = stock.filter(it=>it.section==="local" && words.every(w=>(" "+norm(it.name)).includes(" "+w)));
  return hits.some(h=>h.inStock);
}
function current(item, section){
  if(item.name in switches) return !!switches[item.name];
  if(item.name in DEFAULT_STOCK) return DEFAULT_STOCK[item.name];
  return section==="food" ? true : koronaSays(item);
}

function row(item, section){
  const on = current(item, section);
  return `<li><span><span class="nm">${esc(item.name)}</span><span class="st ${on?"on":""}">${on?"In Stock":"Out of Stock"}</span></span>
    <button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(item.name)} in stock" data-name="${esc(item.name)}" data-sec="${section}"></button></li>`;
}
function render(){
  $("#food").innerHTML = ["Meats","Sides"].map(g=>`<h3 class="grp">${g}</h3><ul>${FOOD.filter(f=>f.group===g).map(f=>row(f,"food")).join("")}</ul>`).join("");
  $("#local").innerHTML = [...new Set(LOCAL.map(l=>l.maker))].map(m=>`<h3 class="grp">${esc(m)}</h3><ul>${LOCAL.filter(l=>l.maker===m).map(l=>row(l,"local")).join("")}</ul>`).join("");
}

document.addEventListener("click", async e=>{
  const sw = e.target.closest && e.target.closest(".sw");
  if(!sw) return;
  const name = sw.dataset.name, next = sw.getAttribute("aria-checked")!=="true";
  sw.disabled = true;
  try{
    const j = await post({ name, inStock: next });
    switches = j.items || switches;
    render(); toast(`${name}: ${next?"In Stock":"Out of Stock"}`);
  }catch(err){
    sw.disabled = false; toast(err.message, true);
    if(/PIN/.test(err.message)) lockPage(err.message);
  }
});

async function unlock(p){
  pin = p;
  await post({ check:true });
  ss.set("bd-pin", pin);
  const [sw, st] = await Promise.all([
    fetch("/api/food-stock",{cache:"no-store"}).then(r=>r.ok?r.json():{items:{}}).catch(()=>({items:{}})),
    fetch("/api/stock").then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
  ]);
  switches = sw.items || {}; stock = st.items || [];
  render();
  $("#pin-form").hidden = true; $("#lists").hidden = false;
}
function lockPage(message){
  pin=""; ss.set("bd-pin",""); $("#lists").hidden = true; $("#pin-form").hidden = false;
  $("#pin").value=""; $("#pin-msg").textContent = message || ""; $("#pin").focus();
}

$("#pin-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const p = $("#pin").value.trim(); if(!p){ $("#pin-msg").textContent="Enter your PIN."; return; }
  $("#pin-go").disabled = true; $("#pin-msg").textContent = "";
  try{ await unlock(p); }catch(err){ $("#pin-msg").textContent = err.message; }
  $("#pin-go").disabled = false;
});
$("#lock").onclick = ()=>lockPage("");

const saved = ss.get("bd-pin");
if(saved){ unlock(saved).catch(err=>lockPage(err.message)); } else { $("#pin").focus(); }
</script>
</body>
</html>
